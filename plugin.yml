name: Waypoint
version: 1.1.0
main: com.a7a.waypoint.WaypointPlugin
api-version: '26.3'
author: A7A
description: a simple fast teleportation method
commands:
  waypoint:
    description: Give the Waypoint item
    usage: /waypoint give <player>
    aliases: [wp]
permissions:
  waypoint.use:
    description: Use the Waypoint item
    default: true
  waypoint.give:
    description: Give the Waypoint item
    default: op
